name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bac_generator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bac_generator"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/bac_generator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run Ruff
        run: ruff check src tests alembic

      - name: Run mypy
        run: mypy src tests

      - name: Run pytest
        run: python -m pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/758439681309/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-actions-deployer@bac-exercise-generator-prod.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: ">= 578.0.0"
          install_components: beta

      - name: Verify Cloud Run sandbox support
        run: |
          gcloud version
          gcloud beta run deploy --help | grep -- "--sandbox-launcher" || {
            echo "Installed gcloud does not support Cloud Run sandbox launcher."
            exit 1
          }

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker \
            europe-west1-docker.pkg.dev \
            --quiet

      - name: Build Docker image
        run: |
          docker build \
            --platform linux/amd64 \
            -t europe-west1-docker.pkg.dev/bac-exercise-generator-prod/bac-exercise-generator/bac-exercise-generator:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push \
            europe-west1-docker.pkg.dev/bac-exercise-generator-prod/bac-exercise-generator/bac-exercise-generator:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud beta run deploy bac-exercise-generator \
            --image=europe-west1-docker.pkg.dev/bac-exercise-generator-prod/bac-exercise-generator/bac-exercise-generator:${{ github.sha }} \
            --region=europe-west1 \
            --platform=managed \
            --execution-environment=gen2 \
            --sandbox-launcher \
            --cpu=1 \
            --memory=1Gi \
            --concurrency=4 \
            --set-env-vars="LLM_PROVIDER=gemini,GEMINI_PROJECT=bac-exercise-generator-prod,GEMINI_LOCATION=europe-west1,GEMINI_MODEL=gemini-2.5-flash,FIREBASE_PROJECT_ID=bac-exercise-generator-prod,CODE_RUNNER_PROVIDER=sandbox" \
            --set-secrets="DATABASE_URL=database-url:latest" \
            --quiet