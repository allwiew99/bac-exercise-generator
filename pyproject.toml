[project]
name = "bac-exercise-generator"
version = "0.1.0"
description = "AI-powered generator and validator for Romanian Bac informatics exercises."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]",
    "pydantic-settings",
    "sqlalchemy[asyncio]",
    "alembic",
    "asyncpg",
    "ollama",
    "greenlet",
    "google-genai",
    "firebase-admin",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
explicit_package_bases = true

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx2",
    "ruff",
    "mypy",
]

[[tool.mypy.overrides]]
module = [
    "firebase_admin",
    "firebase_admin.*",
]
ignore_missing_imports = true